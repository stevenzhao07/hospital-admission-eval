name: smoke
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions: read-all

jobs:
  selftest:
    name: Selftest + demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pinned)
      - name: Run selftest
        run: python hospital_admission_eval.py --selftest
      - name: Run demo
        run: python hospital_admission_eval.py --demo